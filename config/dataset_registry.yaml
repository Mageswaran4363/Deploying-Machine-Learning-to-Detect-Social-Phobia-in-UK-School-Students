# Dataset Registry
# ────────────────────────────────────────────────────────────────────────────
# Controls which dataset the pipeline loads. Change `active` to switch between
# versions. Never edit pipeline source files to switch datasets — only edit
# this file.
#
# Valid values for `active`: synthetic_v1 | pilot_v1 | real_v1
# ────────────────────────────────────────────────────────────────────────────

active: real_v1

datasets:

  synthetic_v1:
    label: "Synthetic dataset — development use only"
    path: data/raw/synthetic_v1.csv
    source: generated
    date_created: "2026-06-18"
    n_records: 300
    validated: true
    deprecated: false
    notes: >
      Generated by scripts/generate_synthetic_data.py using population-
      representative distributions (SPIN Normal(μ=14, σ=9); 10% at-risk
      prevalence). Fixed seed 42 for reproducibility. Safe to use in CI/CD.

  pilot_v1:
    label: "Pilot data — Week 2 instrument validation (10–15 students)"
    path: data/raw/pilot_v1.csv
    source: survey_export
    date_created: null          # Fill on receipt
    n_records: null
    validated: false
    deprecated: false
    notes: >
      Collected during Week 2 pilot to validate the survey instrument and
      pipeline schema. NOT for model training — schema validation and
      pipeline smoke-test only.

  real_v1:
    label: "UKDA-8467 (MHCYP 2017) — school-age (11–18) extract"
    path: data/raw/real_v1.csv
    source: ukda_extract
    date_created: "2026-07-31"
    n_records: 3749
    validated: true
    deprecated: false
    notes: >
      Extracted from UKDA Study 8467 (Mental Health of Children and Young
      People in England 2017). Ages 11–18 only (3,749 participants, 457
      PSU clusters). Target: ICD-10 social phobia (dcsoph=2), n=75 (2.00%).
      Features: parent SDQ, self-report SDQ, WEMWBS wellbeing, demographics,
      and bullying flags. Schema v2.0. Generated by scripts/extract_ukda.py.

  real_v2:
    label: "Full SPIN survey dataset — longitudinal follow-up (Wave 2)"
    path: data/raw/real_v2.csv
    source: survey_export
    date_created: null
    n_records: null
    validated: false
    deprecated: false
    notes: >
      Future UKDA wave 2 deposit. Schema must match schema.json v1.x.
      Activate only after running full transition checklist.
